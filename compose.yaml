services:
  app:
    build:
      context: .
      args: { APP_ENV: dev }
    container_name: worktimeflow_dev
    ports:
      - "8081:80"                 # visit http://localhost:8081
    environment:
      APP_ENV: dev
      SERVER_NAME: ":80"          # accept any host locally
      CADDY_GLOBAL_OPTIONS: "auto_https off"
      SERVER_ROOT: /app/public
      HOME: /tmp
      COMPOSER_HOME: /tmp/composer
      COMPOSER_CACHE_DIR: /tmp/composer/cache
    volumes:
      - ./:/app                   # bind entire project (includes vendor on host)
      - dev_var:/app/var          # keep cache/logs out of your repo
      - ./Caddyfile:/etc/frankenphp/Caddyfile:ro
    depends_on:
      database:
        condition: service_healthy
    tty: true
    user: "0:0"
  #    entrypoint: ["/bin/sh","-lc","/app/docker/entrypoint.sh"]

  tailwind:
    image: worktimeflow-app       # reuse the app image built above
    pull_policy: never
    container_name: worktimeflow_tailwind
    entrypoint: []
    # Tailwind v4 --watch gets no file events through the macOS bind mount, so
    # poll templates/assets once a second and rebuild when something changed.
    command:
      - sh
      - -c
      - |
        touch /tmp/tailwind.stamp
        php bin/console tailwind:build
        while sleep 1; do
          if [ -n "$$(find templates assets -path assets/vendor -prune -o -type f -newer /tmp/tailwind.stamp -print -quit)" ]; then
            touch /tmp/tailwind.stamp
            php bin/console tailwind:build
          fi
        done
    environment:
      APP_ENV: dev
      HOME: /tmp
    volumes:
      - ./:/app
      - dev_var:/app/var
    depends_on:
      app:
        condition: service_started
    tty: true
    user: "0:0"
    restart: unless-stopped

  database:
    image: mariadb:11.4
    container_name: wtf_mariadb
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: root_password
      MARIADB_DATABASE: db
      MARIADB_USER: db_user
      MARIADB_PASSWORD: db_password
    ports:
      - "3307:3306"               # optional host access
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h localhost -p$${MARIADB_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  dev_var:
  mariadb_data:
