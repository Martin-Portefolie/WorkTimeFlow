root_to_da:
    path: /
    controller: Symfony\Bundle\FrameworkBundle\Controller\RedirectController
    defaults:
        route: home
        _locale: da
        permanent: false

controllers:
    resource: '../src/Controller/'
    type: attribute
    prefix: '/{_locale}'
    defaults:
        _locale: da
    requirements:
        _locale: 'da|en'
