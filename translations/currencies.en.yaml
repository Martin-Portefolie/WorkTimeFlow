# Domain: currencies. Use with Twig trans({}, "currencies").
# Country/currency associations: user-supplied https://www.iban.com/currency-codes table.
# Localized names: Symfony Intl, with explicit labels for special units.
# Region groups are for navigation: Russia/Cyprus in Europe; Turkey in Middle East;
# Caucasus/Kazakhstan in Asia; Mexico/Greenland/Bermuda in North America.
# Countries use ISO alpha-2 keys. Currency numbers remain strings, including leading zeroes.
# Duplicate Cuba entry removed. Special units and Antarctic territories retained separately.
# Reviewed against SIX ISO 4217 List One, published 2026-09-17.
# Source: https://www.six-group.com/dam/download/financial-information/data-center/iso-currrency/lists/list-one.xml
# kind: fund marks special fund/accounting codes, excluded from ordinary currency choices.
# Norfolk Island corrected to AUD.
# Example: regions.europe.countries.DK.currencies.DKK

